<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
</head>

<body>

    <h1>Scientific Calculator</h1>

    <div>
        <input type="text" id="display" placeholder="0" readonly>
    </div>

    <br>

    <div>
        <button>AC</button>
        <button>DEL</button>
        <button>%</button>
        <button>÷</button>
    </div>

    <div>
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button>×</button>
    </div>

    <div>
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button>−</button>
    </div>

    <div>
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button>+</button>
    </div>

    <div>
        <button>0</button>
        <button>.</button>
        <button>(</button>
        <button>)</button>
    </div>

    <hr>

    <h2>Scientific Functions</h2>

    <div>
        <button>√</button>
        <button>x²</button>
        <button>xʸ</button>
        <button>1/x</button>
    </div>

    <div>
        <button>sin</button>
        <button>cos</button>
        <button>tan</button>
        <button>log</button>
    </div>

    <div>
        <button>ln</button>
        <button>π</button>
        <button>e</button>
        <button>!</button>
    </div>

    <br>

    <button>=</button>

</body>
</html>
