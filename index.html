<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Paint Studio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =====================================================
     PAINT WINDOW
===================================================== -->

<div class="paint-window">


    <!-- =================================================
         TITLE BAR
    ================================================== -->

    <div class="title-bar">

        <div class="title-left">

            <div class="paint-logo">
                🎨
            </div>

            <div class="title-text">
                Paint Studio
            </div>

        </div>


        <div class="window-buttons">

            <button title="Minimize">
                −
            </button>

            <button title="Maximize">
                □
            </button>

            <button title="Close">
                ×
            </button>

        </div>

    </div>


    <!-- =================================================
         QUICK ACCESS BAR
    ================================================== -->

    <div class="quick-bar">

        <button id="newBtn" title="New">
            📄
        </button>

        <button id="openBtn" title="Open">
            📂
        </button>

        <button id="saveBtn" title="Save">
            💾
        </button>

        <span class="quick-separator"></span>

        <button id="undoBtn" title="Undo">
            ↶
        </button>

        <button id="redoBtn" title="Redo">
            ↷
        </button>

    </div>


    <!-- =================================================
         RIBBON TABS
    ================================================== -->

    <div class="ribbon-tabs">

        <button class="ribbon-tab active">
            Home
        </button>

        <button class="ribbon-tab">
            View
        </button>

    </div>


    <!-- =================================================
         MAIN RIBBON
    ================================================== -->

    <div class="ribbon">


        <!-- =============================================
             CLIPBOARD
        ============================================== -->

        <div class="ribbon-group">

            <div class="group-content clipboard-tools">

                <button
                    id="pasteBtn"
                    class="big-tool"
                    title="Paste">

                    <span class="big-icon">
                        📋
                    </span>

                    <span>
                        Paste
                    </span>

                </button>


                <div class="small-tools">

                    <button
                        id="cutBtn"
                        title="Cut">

                        ✂️ Cut

                    </button>

                    <button
                        id="copyBtn"
                        title="Copy">

                        📄 Copy

                    </button>

                </div>

            </div>

            <div class="group-title">
                Clipboard
            </div>

        </div>


        <!-- =============================================
             IMAGE
        ============================================== -->

        <div class="ribbon-group">

            <div class="group-content image-tools">

                <button
                    id="selectBtn"
                    class="ribbon-tool active"
                    data-tool="select">

                    <span>🔲</span>
                    <small>Select</small>

                </button>


                <button
                    id="cropBtn"
                    class="ribbon-tool"
                    data-tool="crop">

                    <span>✂</span>
                    <small>Crop</small>

                </button>


                <button
                    id="resizeBtn"
                    class="ribbon-tool"
                    data-tool="resize">

                    <span>↔️</span>
                    <small>Resize</small>

                </button>


                <button
                    id="rotateBtn"
                    class="ribbon-tool"
                    data-tool="rotate">

                    <span>🔄</span>
                    <small>Rotate</small>

                </button>

            </div>

            <div class="group-title">
                Image
            </div>

        </div>


        <!-- =============================================
             TOOLS
        ============================================== -->

        <div class="ribbon-group">

            <div class="group-content tools-grid">


                <button
                    class="ribbon-tool"
                    data-tool="pencil">

                    <span>✏️</span>
                    <small>Pencil</small>

                </button>


                <button
                    class="ribbon-tool"
                    data-tool="brush">

                    <span>🖌️</span>
                    <small>Brush</small>

                </button>


                <button
                    class="ribbon-tool"
                    data-tool="fill">

                    <span>🪣</span>
                    <small>Fill</small>

                </button>


                <button
                    class="ribbon-tool"
                    data-tool="eraser">

                    <span>🧽</span>
                    <small>Eraser</small>

                </button>


                <button
                    class="ribbon-tool"
                    data-tool="picker">

                    <span>💉</span>
                    <small>Color Picker</small>

                </button>


                <button
                    class="ribbon-tool"
                    data-tool="text">

                    <span>🔤</span>
                    <small>Text</small>

                </button>


                <button
                    class="ribbon-tool"
                    data-tool="magnifier">

                    <span>🔍</span>
                    <small>Magnifier</small>

                </button>

            </div>

            <div class="group-title">
                Tools
            </div>

        </div>


        <!-- =============================================
             BRUSHES
        ============================================== -->

        <div class="ribbon-group brushes-group">

            <div class="group-content brushes">

                <button
                    class="brush-option active"
                    data-brush="pencil">

                    ✏️

                </button>

                <button
                    class="brush-option"
                    data-brush="normal">

                    🖌️

                </button>

                <button
                    class="brush-option"
                    data-brush="marker">

                    🖍️

                </button>

                <button
                    class="brush-option"
                    data-brush="airbrush">

                    💨

                </button>

                <button
                    class="brush-option"
                    data-brush="calligraphy">

                    🖋️

                </button>

            </div>

            <div class="group-title">
                Brushes
            </div>

        </div>


        <!-- =============================================
             SHAPES
        ============================================== -->

        <div class="ribbon-group shapes-group">

            <div class="group-content shapes">


                <button
                    class="shape-tool"
                    data-shape="line"
                    title="Line">

                    ╱

                </button>


                <button
                    class="shape-tool"
                    data-shape="curve"
                    title="Curve">

                    〰

                </button>


                <button
                    class="shape-tool"
                    data-shape="rectangle"
                    title="Rectangle">

                    ▭

                </button>


                <button
                    class="shape-tool"
                    data-shape="rounded-rectangle"
                    title="Rounded Rectangle">

                    ▢

                </button>


                <button
                    class="shape-tool"
                    data-shape="ellipse"
                    title="Ellipse">

                    ⬭

                </button>


                <button
                    class="shape-tool"
                    data-shape="triangle"
                    title="Triangle">

                    △

                </button>


                <button
                    class="shape-tool"
                    data-shape="diamond"
                    title="Diamond">

                    ◇

                </button>


                <button
                    class="shape-tool"
                    data-shape="pentagon"
                    title="Pentagon">

                    ⬠

                </button>


                <button
                    class="shape-tool"
                    data-shape="hexagon"
                    title="Hexagon">

                    ⬡

                </button>


                <button
                    class="shape-tool"
                    data-shape="star"
                    title="Star">

                    ☆

                </button>


                <button
                    class="shape-tool"
                    data-shape="arrow-right"
                    title="Right Arrow">

                    ➜

                </button>


                <button
                    class="shape-tool"
                    data-shape="arrow-left"
                    title="Left Arrow">

                    ←

                </button>


                <button
                    class="shape-tool"
                    data-shape="arrow-up"
                    title="Up Arrow">

                    ↑

                </button>


                <button
                    class="shape-tool"
                    data-shape="arrow-down"
                    title="Down Arrow">

                    ↓

                </button>


                <button
                    class="shape-tool"
                    data-shape="heart"
                    title="Heart">

                    ♡

                </button>


                <button
                    class="shape-tool"
                    data-shape="lightning"
                    title="Lightning">

                    ⚡

                </button>


                <button
                    class="shape-tool"
                    data-shape="cloud"
                    title="Cloud">

                    ☁

                </button>


                <button
                    class="shape-tool"
                    data-shape="speech"
                    title="Speech Bubble">

                    💬

                </button>


                <button
                    class="shape-tool"
                    data-shape="sun"
                    title="Sun">

                    ☀

                </button>


                <button
                    class="shape-tool"
                    data-shape="crescent"
                    title="Crescent">

                    ☾

                </button>


            </div>

            <div class="group-title">
                Shapes
            </div>

        </div>


        <!-- =============================================
             SIZE
        ============================================== -->

        <div class="ribbon-group size-group">

            <div class="group-content size-tools">

                <label>
                    Size
                </label>

                <select id="brushSize">

                    <option value="1">
                        1 px
                    </option>

                    <option value="2">
                        2 px
                    </option>

                    <option value="5" selected>
                        5 px
                    </option>

                    <option value="8">
                        8 px
                    </option>

                    <option value="12">
                        12 px
                    </option>

                    <option value="20">
                        20 px
                    </option>

                    <option value="30">
                        30 px
                    </option>

                    <option value="50">
                        50 px
                    </option>

                </select>

            </div>

            <div class="group-title">
                Size
            </div>

        </div>


        <!-- =============================================
             COLORS
        ============================================== -->

        <div class="ribbon-group colors-group">

            <div class="group-content color-tools">


                <div class="color-boxes">

                    <div class="color-box color-one">

                        <span>
                            Color 1
                        </span>

                        <input
                            type="color"
                            id="colorPicker"
                            value="#000000">

                    </div>


                    <div class="color-box color-two">

                        <span>
                            Color 2
                        </span>

                        <input
                            type="color"
                            id="fillColor"
                            value="#ffffff">

                    </div>

                </div>


                <div class="color-palette">


                    <button
                        class="palette-color"
                        data-color="#000000"
                        style="background:#000000">
                    </button>

                    <button
                        class="palette-color"
                        data-color="#ffffff"
                        style="background:#ffffff">
                    </button>

                    <button
                        class="palette-color"
                        data-color="#808080"
                        style="background:#808080">
                    </button>

                    <button
                        class="palette-color"
                        data-color="#c0c0c0"
                        style="background:#c0c0c0">
                    </button>

                    <button
                        class="palette-color"
                        data-color="#800000"
                        style="background:#800000">
                    </button>

                    <button
                        class="palette-color"
                        data-color="#ff0000"
                        style="background:#ff0000">
                    </button>

                    <button
                        class="palette-color"
                        data-color="#808000"
                        style="background:#808000">
                    </button>

                    <button
                        class="palette-color"
                        data-color="#ffff00"
                        style="background:#ffff00">
                    </button>

                    <button
                        class="palette-color"
                        data-color="#008000"
                        style="background:#008000">
                    </button>

                    <button
                        class="palette-color"
                        data-color="#00ff00"
                        style="background:#00ff00">
                    </button>

                    <button
                        class="palette-color"
                        data-color="#008080"
                        style="background:#008080">
                    </button>

                    <button
                        class="palette-color"
                        data-color="#00ffff"
                        style="background:#00ffff">
                    </button>

                    <button
                        class="palette-color"
                        data-color="#000080"
                        style="background:#000080">
                    </button>

                    <button
                        class="palette-color"
                        data-color="#0000ff"
                        style="background:#0000ff">
                    </button>

                    <button
                        class="palette-color"
                        data-color="#800080"
                        style="background:#800080">
                    </button>

                    <button
                        class="palette-color"
                        data-color="#ff00ff"
                        style="background:#ff00ff">
                    </button>

                    <button
                        class="palette-color"
                        data-color="#ffa500"
                        style="background:#ffa500">
                    </button>

                    <button
                        class="palette-color"
                        data-color="#a52a2a"
                        style="background:#a52a2a">
                    </button>

                    <button
                        class="palette-color"
                        data-color="#ffc0cb"
                        style="background:#ffc0cb">
                    </button>

                    <button
                        class="palette-color"
                        data-color="#00aaff"
                        style="background:#00aaff">
                    </button>

                </div>

            </div>

            <div class="group-title">
                Colors
            </div>

        </div>

    </div>


    <!-- =================================================
         CANVAS WORKSPACE
    ================================================== -->

    <main class="canvas-area">


        <div class="canvas-header">

            <span id="toolStatus">
                Select
            </span>

            <span id="objectStatus">
                Objects: 0
            </span>

        </div>


        <div
            class="canvas-container"
            id="canvasContainer">

            <canvas
                id="drawingCanvas"
                width="1400"
                height="800">
            </canvas>

        </div>


        <div class="canvas-footer">

            <span id="coordinates">
                X: 0 Y: 0
            </span>

            <span>
                1400 × 800 px
            </span>

            <div class="zoom-control">

                <button id="zoomOut">
                    −
                </button>

                <span id="zoomValue">
                    100%
                </span>

                <button id="zoomIn">
                    +
                </button>

            </div>

        </div>

    </main>


    <!-- =================================================
         STATUS BAR
    ================================================== -->

    <div class="status-bar">

        <span>
            Ready
        </span>

        <span>
            Paint Studio
        </span>

        <span>
            © 2026
        </span>

    </div>


</div>


<!-- =====================================================
     IMAGE FILE INPUT
====================================================== -->

<input
    type="file"
    id="imageInput"
    accept="image/*"
    hidden>


<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script src="script.js"></script>

</body>
</html>
